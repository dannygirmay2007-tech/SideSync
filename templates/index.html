<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SideSync</title>
</head>
<body>
    <h1>SideSync</h1>
    <p>Create fair pickup soccer teams.</p>
    <p>{{ player_count}} players added</p>
    <ul>
    {% for player in players %}
        <li>{{ player }}</li>
    {% endfor %}
    </ul>
    <h2>Add Player</h2>
    <form method="POST">
        <label for="player_name">Player name:</label>
        <input type = "text" id="player_name" name="player_name" required>
        <button type="submit">Add Player</button>
    </form>
</body>
</html>
